name: Build Worldwide Playlist

on:
  # every hour — the __hdnea__ tokens on the source expire ~6h,
  # but hourly keeps things fresh and lets you catch source changes fast.
  schedule:
    - cron: "0 * * * *"

  # allow running manually from the Actions tab
  workflow_dispatch:

  # rebuild on script/workflow changes
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: build-playlist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build worldwide playlist (M3U + JSON)
        env:
          SOURCE_URL: https://alex4528.site/playlist/jstar.m3u
        run: |
          python scripts/build_playlist.py
          echo "----- head of M3U -----"
          head -14 output/worldwide.m3u
          echo "----- stats -----"
          cat output/worldwide.stats.json
          echo
          echo "----- sizes -----"
          ls -la output/

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/worldwide.m3u output/worldwide.json output/worldwide.stats.json

          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi

          STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "chore(playlist): refresh worldwide.m3u + .json ($STAMP)"
          git push
